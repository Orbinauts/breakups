name: Pages

# The one GitHub Pages workflow. It puts the served tree together from its
# two parts and deploys both at once, so neither wipes out the other
# (scripts/pages/site.ts):
# - the reference TypeDoc generates from main's docblocks, at the root;
# - `v1/`, the published breakups, from the orphan branch `published`.
#   Before that branch exists the reference deploys alone.
#
# It runs on every push to main, by hand, and when the daily prospective
# job calls it after committing to `published`: a push made with the
# workflow's token starts no workflow. The `github-pages` environment
# accepts deployments from main only. The file keeps the name `docs.yml`,
# which the maintenance workflow dispatches by.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A branch that is not there yet gives an empty answer and the reference deploys alone; a failed lookup fails the run rather than deploying a site with no `v1/`.
      - id: published
        name: Check whether the published branch exists
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --heads origin refs/heads/published)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No branch 'published' yet: the reference deploys without v1/."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.exists == 'true'
        with:
          ref: published
          path: published
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      # typedoc.json: every export of the entry point, the README first, warnings fail the build.
      - run: npm run docs
      - name: Put the reference and the published files together
        run: npm run pages:site -- --reference reference --published published --out site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages takes one deployment at a time; a newer one waits for the running one rather than cutting it off.
    # The group sits on this job alone: one on the whole workflow would deadlock a caller holding the same group,
    # and a push to main would wait behind the daily replay.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      # GitHub Pages checks the deployment against the job's OIDC token.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
