name: Watch

# The watcher of public notices of fragmentations (scripts/maintenance/watch.ts),
# once a day. It reads the pages anyone can read without an account (NASA's
# Orbital Debris Quarterly News, ESA's Space Environment Report, Jonathan's
# Space Report, and the RSS feeds of EarthSky, Space.com, SpaceNews and Ars
# Technica's space desk) and opens a `breakup-report` issue prefilled with
# each notice no issue carries yet, the day's news gathered into one. It
# never writes the truth: a person completes the issue and the owner
# accepts it (breakup-report.yml). A page that cannot be read, or whose
# shape changed, fails the run after the others are read, with an issue
# labelled `maintenance` (a comment on the one open). To pause it:
# gh workflow disable watch.yml.

on:
  schedule:
    # Every day at 07:41 UTC, after the prospective test's run and away from the hour.
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The notices' issues, and the failure's.
  issues: write

env:
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  watch:
    name: read the public notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the dependencies
        run: npm install --no-audit --no-fund
      - name: Read the notices and open their issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run -s maintenance:watch 2>&1 | tee "$RUNNER_TEMP/watch.log"
      - name: Open an issue with the log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create maintenance --color 0e8a16 --description "The project's automatic upkeep: a failed run, a refused step, or a check a person must make" --force
          title="The watcher of public notices failed"
          body="$RUNNER_TEMP/failure.md"
          {
            echo "The watch run $RUN_URL failed: a page could not be read or its shape changed, and its notices were not read. The issues of the other pages were opened. The end of its log:"
            echo
            echo '```text'
            tail -c 20000 "$RUNNER_TEMP/watch.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } > "$body"
          number=$(gh issue list --label maintenance --state open --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --label maintenance --body-file "$body"
          fi
