name: Maintenance

# The project's weekly upkeep, so the truth, the scorecard, the README and
# the prospective test's score stay current with no one at the keyboard
# (docs/decisions/0009-the-project-keeps-itself-up-to-date.md). On a fresh
# runner, every Monday:
#
# 1. The machine-readable sources of the truth are fetched again (GCAT's
#    debris clouds and satellite catalogue, NASA's history, whose PDF is
#    turned into text only when its hash changed) and the truth is rebuilt.
#    A source with no new edition keeps its snapshot and record, so a quiet
#    week makes no diff.
# 2. The plan (scripts/maintenance/plan.ts) says what else is due: the
#    scorecard is replayed where the committed aggregate no longer
#    describes the truth or the Archive's release; a closed year is
#    promoted into the Archive from the prospective test's day slices on
#    the first run from 5 January (scripts/maintenance/promote.ts, refused
#    with an issue where its tarball would pass the 2 GiB asset limit);
#    and in the week of the first Monday of January, April, July and
#    October a reminder issue lists what a person must check by hand.
# 3. Where the scorecard is replayed, the whole Archive is downloaded, the
#    catalogue index rebuilt, and every year replayed in order from the
#    states the one before ended with (a year a process, as the KPI
#    workflow replays them: the same result as `npm run kpi -- --all`),
#    which writes kpi/latest.json, kpi/latest.md and the per-event
#    dissection docs/detector/events.md.
# 4. Always: the README's generated parts are written from the files
#    (`npm run kpi:readme`), and the prospective test is scored: score.md
#    on the `prospective` branch, and its summary in the README.
# 5. Every check runs: the typecheck, the tests and the documentation
#    build. A failure anywhere opens an issue labelled `maintenance` with
#    the log (or comments on the one open) and nothing is merged.
# 6. Where anything changed, a branch `maintenance/<date>` is committed by
#    the Actions bot, a pull request says what moved and why, CI runs on it
#    and must pass, the Archive's year and side files are uploaded, and the
#    pull request is squashed into main. A merge made with the workflow's token starts no workflow,
#    so CI, the KPI workflow and the docs are run on main by hand here, and
#    their runs are linked on the pull request. Nothing changed: no pull
#    request.
#
# By hand: `gh workflow run maintenance.yml` runs it at once;
# `-f rescore=true` replays the scorecard whatever the plan says;
# `-f merge=false` leaves the pull request open for review (and uploads
# nothing to the Archive's release); `-f from=<branch>` folds a branch in
# first, such as one adding a row to the hand file of the truth. To pause
# it: gh workflow disable maintenance.yml.

on:
  schedule:
    # Mondays at 04:17 UTC: after the prospective test's daily run, off the hour when scheduled runs queue.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      rescore:
        description: Replay the scorecard whatever the plan says
        type: boolean
        default: false
      merge:
        description: Merge the pull request once every check has passed (off leaves it open for review)
        type: boolean
        default: true
      from:
        description: A branch to fold in first, such as one adding a hand row to the truth
        type: string
        default: ""

# The same group as the prospective test's: the two never run at once, so the `prospective` branch, the releases and the Archive are never written by both.
concurrency:
  group: prospective
  cancel-in-progress: false

permissions:
  # The maintenance branch, the `prospective` branch's score, and the uploads to the Archive's release.
  contents: write
  pull-requests: write
  # The failure, refusal and reminder issues, and their label.
  issues: write
  # CI, the KPI workflow and the docs run on main after the merge.
  actions: write

env:
  # The decoded-column cache would keep every year unpacked beside the Archive; this run reads each year once.
  BREAKUPS_DECODED: "off"
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  LABEL_COLOR: 0e8a16
  LABEL_DESCRIPTION: "The project's automatic upkeep: a failed run, a refused step, or a check a person must make"

jobs:
  maintain:
    name: refresh, check and merge
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          # The whole history: the prospective score reads when the truth last changed, and the pull request compares with the base.
          fetch-depth: 0
      - name: Check out the prospective branch (the test's log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prospective
          path: prospective
          fetch-depth: 0
      - name: Start the log and name the bot
        run: |
          set -euo pipefail
          echo "LOG=$RUNNER_TEMP/maintenance.log" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/maintenance.log"
          for dir in main prospective; do
            git -C "$dir" config user.name "$BOT_NAME"
            git -C "$dir" config user.email "$BOT_EMAIL"
          done
          echo "BASE=$(git -C main rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fold in a branch
        if: inputs.from != ''
        working-directory: main
        env:
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          case "$FROM" in -* | *[!A-Za-z0-9._/-]*) echo "::error::not a branch name: $FROM"; exit 1 ;; esac
          git fetch --quiet origin "+refs/heads/$FROM:refs/remotes/origin/$FROM"
          git merge --no-ff -m "Fold in $FROM" "origin/$FROM"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the dependencies
        working-directory: main
        run: npm install --no-audit --no-fund
      # NASA's history is read from its PDF's text; pdftotext runs only when the PDF's hash changed.
      - name: Install poppler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -1
      # The Archive (some seven gigabytes) on the runner's larger disk.
      - name: Place the Archive
        run: |
          set -euo pipefail
          avail() { df --output=avail -B1 "$1" | tail -1; }
          if [ -d /mnt ] && sudo -n true 2>/dev/null && [ "$(avail /mnt)" -gt "$(avail "$GITHUB_WORKSPACE")" ]; then
            sudo mkdir -p /mnt/breakups-archive
            sudo chown "$(id -u):$(id -g)" /mnt/breakups-archive
            archive=/mnt/breakups-archive
          else
            archive="$GITHUB_WORKSPACE/breakups-archive"
            mkdir -p "$archive"
          fi
          echo "BREAKUPS_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "the Archive is at $archive"
      - name: Fetch the machine-readable sources and rebuild the truth
        working-directory: main
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          npm run -s truth:fetch -- --only gcat,gcat-satcat,hoosf-16e
          npm run -s truth
          git status --short
      - name: Plan the run
        id: plan
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          RESCORE: ${{ inputs.rescore == true }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          args=()
          if [ "$RESCORE" = true ]; then args+=(--rescore); fi
          npm run -s maintenance:plan -- "${args[@]}"
      - name: Open the quarterly reminder
        if: steps.plan.outputs.reminder != ''
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          npm run -s maintenance:reminder
      - name: Promote the closed year into the Archive
        id: promote
        if: steps.plan.outputs.promote != ''
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.plan.outputs.promote }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          npm run -s archive:download
          npm run -s maintenance:promote -- "$YEAR"
      - name: Replay the scorecard over the whole Archive
        if: steps.plan.outputs.rescore == 'true'
        working-directory: main
        env:
          YEARS: ${{ steps.plan.outputs.years }}
          PLANNED: ${{ steps.plan.outputs.promote }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          wanted="$YEARS"
          # A year planned for promotion and refused is replayed as the release holds it.
          if [ -n "$PLANNED" ] && [ -z "$PROMOTED" ]; then wanted="$wanted $PLANNED"; fi
          # shellcheck disable=SC2086
          npm run -s archive:download -- $wanted
          npm run -s kpi:index
          for dir in "$BREAKUPS_ARCHIVE"/[0-9][0-9][0-9][0-9]; do
            if [ -f "$dir/manifest.json" ]; then npm run -s kpi:year -- "$(basename "$dir")"; fi
          done
          npm run -s kpi -- --aggregate
          df -h "$BREAKUPS_ARCHIVE"
      - name: Write the README's tables
        working-directory: main
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          npm run -s kpi:readme
      - name: Score the prospective test
        working-directory: main
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          git fetch --quiet origin "+refs/heads/prospective:refs/remotes/origin/prospective"
          npm run -s prospective:score -- --ref origin/prospective --base "$BASE" --markdown ../prospective/score.md --readme
      # The score is the test's, whatever main's checks say, so it is kept before them.
      - name: Keep the score on the prospective branch
        working-directory: prospective
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          git add score.md
          if git diff --cached --quiet; then
            echo "score.md is unchanged"
            exit 0
          fi
          git commit -q -m "Score of $(date -u +%F)" -m "The weekly maintenance run scored the alerts logged since the freeze against the truth on main and wrote the score to score.md. It ran as $RUN_URL."
          git pull -q --rebase origin prospective
          git push -q origin HEAD:prospective
          git log -1 --format='pushed %H at %cI'
      - name: Run every check
        working-directory: main
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          npm run typecheck
          npm test
          npm run docs
      - name: Look for changes
        id: changes
        working-directory: main
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          git status --porcelain
          if [ -n "$(git status --porcelain)" ] || [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing changed: no pull request"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the pull request and merge it
        id: pr
        if: steps.changes.outputs.changed == 'true'
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE: ${{ github.event_name == 'schedule' || inputs.merge }}
          RESCORED: ${{ steps.plan.outputs.rescore }}
          RESCORE_REASONS: ${{ steps.plan.outputs.rescore == 'true' && steps.plan.outputs.reasons || '' }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          branch="maintenance/$(date -u +%F)"
          out="$RUNNER_TEMP/pr"
          mkdir -p "$out"
          npm run -s maintenance:pr -- --base "$BASE" --out "$out"
          title=$(cat "$out/title.txt")
          if [ "$MERGE" != true ]; then
            printf '\n%s\n' "Left open for review by the run's choice: the Archive's year and side files are not uploaded. Merge it with the uploads by running the workflow again with merge on." >> "$out/body.md"
          fi
          gh label create maintenance --color "$LABEL_COLOR" --description "$LABEL_DESCRIPTION" --force
          # An open maintenance pull request is superseded by this one: closed, its branch deleted.
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("maintenance/")) | .number' | while read -r number; do
            gh pr close "$number" --delete-branch --comment "Superseded by the maintenance run $RUN_URL."
          done
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then git push -q origin --delete "$branch"; fi
          git switch -q -c "$branch"
          git add -A
          { cat "$out/title.txt"; echo; cat "$out/message.txt"; } > "$out/commit.txt"
          # A branch folded in with nothing generated beside it is the change itself: there is nothing more to commit.
          if ! git diff --cached --quiet; then git commit -q -F "$out/commit.txt"; fi
          git push -q origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$out/body.md" --label maintenance)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "opened $url"
          if [ "$MERGE" != true ]; then
            echo "left open for review"
            exit 0
          fi
          # The checks ran on a tree made from main as it was; a main that moved since is not merged into blind.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$BASE" ]; then
            gh pr comment "$url" --body "Main moved while this run checked its tree, so it is not merged: the checks ran on a base that is no longer main. The next run starts again from main and supersedes this pull request."
            exit 0
          fi
          # A pull request the bot opens starts CI and the KPI workflow, each held for approval as a first-time contributor's.
          # The run approves CI's, waits for it and merges only once it has passed: a second check of the tree with the configuration a person's pull request meets.
          # The KPI workflow's, an hour's replay of what this run has replayed already where anything moved, runs on main after the merge instead:
          # its held run, which never ran a job, is deleted, since a held run whose pull request is merged ends as a failure.
          # Both are waited for until they exist, since a run started after the merge finds no merge ref and fails.
          sha=$(git rev-parse HEAD)
          ci=""
          kpi=""
          for _ in $(seq 1 12); do
            runs=$(gh run list --commit "$sha" --event pull_request --json databaseId,workflowName)
            ci=$(jq -r '[.[] | select(.workflowName == "CI")][0].databaseId // empty' <<< "$runs")
            kpi=$(jq -r '[.[] | select(.workflowName == "KPI")][0].databaseId // empty' <<< "$runs")
            if [ -n "$ci" ] && [ -n "$kpi" ]; then break; fi
            sleep 5
          done
          if [ -n "$ci" ] && [ "$(gh run view "$ci" --json conclusion --jq .conclusion)" = action_required ]; then
            gh api -X POST "repos/$GH_REPO/actions/runs/$ci/approve" > /dev/null || echo "::notice::CI's run on the pull request could not be approved by the workflow's token"
            sleep 10
          fi
          if [ -n "$kpi" ] && [ "$(gh run view "$kpi" --json conclusion --jq .conclusion)" = action_required ]; then
            gh run delete "$kpi" > /dev/null || echo "::notice::the KPI workflow's held run on the pull request could not be deleted"
          fi
          if [ -n "$ci" ] && [ "$(gh run view "$ci" --json conclusion --jq .conclusion)" != action_required ]; then
            if ! gh run watch "$ci" --exit-status --interval 15 > /dev/null; then
              gh pr comment "$url" --body "CI failed on this pull request ($RUN_URL), so it is not merged."
              echo "::error::CI failed on the pull request"
              exit 1
            fi
            echo "CI passed on the pull request"
          else
            echo "::notice::CI did not run on the pull request; the checks this run made stand alone"
          fi
          # The release's side files (and a promoted year) go up before the merge, so the KPI workflow on main finds the index the merged truth needs.
          if [ "$RESCORED" = true ]; then
            if [ -n "$PROMOTED" ]; then npm run -s archive:upload -- "$PROMOTED"; else npm run -s archive:upload -- --side-only; fi
          fi
          gh pr merge "$url" --squash --delete-branch --subject "$title" --body-file "$out/message.txt"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Run CI, the KPI workflow and the docs on main
        if: steps.pr.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for workflow in ci.yml kpi.yml docs.yml; do gh workflow run "$workflow" --ref main; done
          links=""
          for workflow in ci.yml kpi.yml docs.yml; do
            url=""
            for _ in $(seq 1 20); do
              url=$(gh run list --workflow "$workflow" --branch main --event workflow_dispatch --limit 5 --json url,createdAt --jq "map(select(.createdAt >= \"$since\")) | .[0].url // empty")
              if [ -n "$url" ]; then break; fi
              sleep 6
            done
            links="$links- $workflow: ${url:-not found}"$'\n'
          done
          printf '%s' "$links"
          gh pr comment "$PR_URL" --body "Merged. A merge made with the workflow's token starts no workflow, so these runs on main were started by the maintenance run:"$'\n\n'"$links"
      - name: Open an issue with the log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create maintenance --color "$LABEL_COLOR" --description "$LABEL_DESCRIPTION" --force
          title="The weekly maintenance failed"
          body="$RUNNER_TEMP/failure.md"
          {
            echo "The maintenance run $RUN_URL failed; whatever it had not merged by then is not merged. The end of its log:"
            echo
            echo '```text'
            tail -c 60000 "$LOG" 2>/dev/null || echo "(no log)"
            echo '```'
          } > "$body"
          number=$(gh issue list --label maintenance --state open --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --label maintenance --body-file "$body"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maintenance-log
          path: ${{ runner.temp }}/maintenance.log
          if-no-files-found: warn
          retention-days: 90
