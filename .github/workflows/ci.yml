name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# A new push supersedes the run of the last one: the older run is cancelled rather than finished for nobody.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One Node version failing says nothing about the other: both finish.
      fail-fast: false
      matrix:
        # The oldest Node the manifest's engines field accepts, and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # No lockfile: the dependencies resolve from the manifest's ranges, as they do in a consumer's project.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # The truth rebuilt from the committed snapshots must be the committed file; the tests check it, this shows the diff if not.
      - run: npm run truth && git diff --exit-code -- data/breakups.json docs/truth.md
      # The build and the tarball it makes, without publishing: `prepack` builds, `--dry-run` lists what would ship.
      - run: npm pack --dry-run
