name: Release

# A release is the commit on main whose package.json carries a version the
# commit before it did not: that version is tagged `v<version>` and released
# on GitHub with its CHANGELOG entry, then installed from the tag into an
# empty directory to read the ground truth. Any other push to main stops at
# the first job.
#
# The package is not published to npm (docs/decisions/0012): the breakups
# are read from the published JSON on Pages, and the library is installed
# from the repository's tag, which `prepare` builds on install.

on:
  push:
    branches: [main]

# Never two releases at once, and never one cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pushed commit and its parent: the version is compared with the parent's.
          fetch-depth: 2
          persist-credentials: false
      - id: compare
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          # The first commit has no parent, and a parent may have no manifest: both count as a new version.
          previous=""
          if git cat-file -e HEAD^:package.json 2>/dev/null; then
            previous=$(git show HEAD^:package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$previous" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version $version unchanged; nothing to release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version ${previous:-(none)} -> $version"
          fi

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The tag and the release.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Each step checks whether its work is already done, so a failed run can be rerun from the start.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Read the CHANGELOG entry
        run: |
          set -euo pipefail
          # The lines under the version's heading (`## [<version>] - <date>`), up to the next heading of that level
          # or the link definitions Keep a Changelog puts at the foot of the file.
          awk -v version="$VERSION" '
            /^## / { if (inside) exit; inside = index($0, "## [" version "]") == 1; next }
            /^\[.*\]: / { if (inside) exit }
            inside
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::no entry for $VERSION"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "release v$VERSION exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  smoke:
    needs: [version, release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tagged version into an empty directory
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir smoke
          cd smoke
          echo '{ "name": "smoke", "private": true, "type": "module" }' > package.json
          # `prepare` builds the library from the tag's sources as npm installs it.
          npm install --no-audit --no-fund "github:$REPOSITORY#v$VERSION"
      - name: Read the ground truth
        working-directory: ${{ runner.temp }}/smoke
        run: |
          set -euo pipefail
          cat > smoke.js <<'SCRIPT'
          import { readBreakups, yearOf } from "@orbinauts/breakups";
          import file from "@orbinauts/breakups/breakups.json" with { type: "json" };

          const breakups = readBreakups(file);
          const scoreable = breakups.filter((breakup) => breakup.scoreable && yearOf(breakup) >= 2005);
          console.log(`${breakups.length} events, ${scoreable.length} scoreable from 2005`);
          if (breakups.length < 500 || scoreable.length < 140) throw new Error("the ground truth is short");
          SCRIPT
          node smoke.js
