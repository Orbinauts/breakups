name: KPI

# The scorecard, recomputed over the Archive: one job replaying the years
# of the committed aggregate in order, each downloading its year of the
# release, replaying it from the states the previous year ended with and
# scoring it, then folding the years into the aggregate, writing the table
# to the run's summary, keeping one comment on a pull request up to date
# with the diff against the committed `kpi/latest.json`, and failing, on
# main and on a pull request alike, when a fresh aggregate differs from the committed one: the
# committed score is the record, and the proof is that this workflow can
# make it again.
#
# The years run in order in one job, not in a matrix, because the
# detector's verdict depends on each object's record of steps over two
# years: a year replayed cold would score every object's first step of
# the year as new. Each year's Archive is deleted once the next year is
# scored, so the runner's disk holds two years at a time. What the
# scorecard reads of every year's catalogue (each body's facts, the
# reentries the detector is given, the truth's parents' last sets) it
# reads from the catalogue index the side files carry, built from the
# whole Archive and refused where stale, never from the two years on disk.
# The per-year files are kept as artifacts of the run, not in git.
#
# Where the release is unreachable (an outage, a release deleted or
# renamed) the run fails: a check that cannot run is not a check passed.
# Only a pull request from a fork skips the replay, with a notice.
#
# A pull request is replayed only where it touches a file the replay or
# its reproducibility step reads: the replay takes an hour, and one that
# changes only Markdown (other than `kpi/latest.md`), `docs/`, `LICENSE`,
# the tests, another workflow or an issue form cannot move the score. The filter starts
# from every path and lists what it skips, then adds back what those
# patterns would skip but the replay reads; GitHub lets the last matching
# pattern decide, so a file nobody listed is still replayed. GitHub reads
# only the first 300 files a pull request changes against the filter: a
# larger one whose first 300 all match a skipped pattern starts no run.
# A push to main, the Monday schedule and a run by hand always replay:
# main's run is the record (docs/decisions/0004), and the release and the
# truth can change without a push. The KPI check is not among main's
# required checks, so a pull request it skips is never held waiting on it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!LICENSE"
      - "!test/**"
      - "!**/*.test.ts"
      - "!.github/workflows/**"
      - "!.github/ISSUE_TEMPLATE/**"
      # Read by the replay or its reproducibility step, though a pattern above skips it.
      - "kpi/latest.md"
      - ".github/workflows/kpi.yml"
  schedule:
    # Mondays at 12:23 UTC: the release and the truth may change without a push. After the maintenance run's
    # longest window (04:17, or 05:37 where it waited for the daily test, plus its 330 minutes), off the hour.
    - cron: "23 12 * * 1"
  workflow_dispatch:

# On its schedule the run joins the group of the maintenance run and the prospective test, so it never
# downloads the Archive's release while the maintenance run replaces its files, and never cancels either.
# Every other run keeps a group of its own, where a new run supersedes the last: GitHub keeps one pending run
# per group and a newer one displaces it, so a push's run, or the run the maintenance run starts by hand on
# main after its merge (when its uploads are done), queued in the shared group could displace a daily run of
# the test waiting there.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'prospective' || format('kpi-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  ARCHIVE_MANIFEST_URL: https://github.com/Orbinauts/breakups/releases/download/archive-v1/manifest.json
  # The decoded-column cache keeps each year's columns unpacked beside the Archive, over a gigabyte for a recent year, for replays to come; this job reads each year once or twice and keeps two years on disk, so it keeps nothing.
  BREAKUPS_DECODED: "off"

jobs:
  years:
    name: the years to score
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.list.outputs.years }}
      reachable: ${{ steps.reach.outputs.reachable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The years in the committed aggregate: what the replay below scores, in order.
      - id: list
        run: |
          set -euo pipefail
          years=$(node -p 'require("./kpi/latest.json").years.join(" ")')
          echo "years=$years" >> "$GITHUB_OUTPUT"
          echo "years: $years"
      # An unreachable release fails the run, but on a pull request from a fork, which cannot be expected to read it.
      - id: reach
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if curl --silent --fail --head --location --max-time 60 --output /dev/null "$ARCHIVE_MANIFEST_URL"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = true ]; then
            echo "::notice::the Archive's release is unreachable from this fork's pull request; the scorecard is skipped"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the Archive's release is unreachable ($ARCHIVE_MANIFEST_URL), so the committed scorecard cannot be made again: the check fails rather than pass unchecked"
            exit 1
          fi

  replay:
    name: replay the years in order
    needs: years
    if: needs.years.outputs.reachable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one comment kept up to date on a pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The score is made on the committed scoring pins (pins.json), not the ranges CI installs from, and the install fails naming any package not at its pin.
      - name: Install the scoring pins
        run: npm run -s pins -- install scoring
      # The side files before any year: the space weather and the catalogue index, through which every year is scored against the whole Archive's catalogue; the download verifies the tarball's hash and that the index describes the released years.
      - name: Fetch the side files and the catalogue index
        run: |
          set -euo pipefail
          npm run archive:download
          test -f ../breakups-archive/index/catalogue-index.json.gz
      # Each year downloaded into the Archive's home beside the repository, its hash verified, replayed from the states the year before left, and deleted once the next is done.
      - name: Replay each year from the states the one before ended with
        env:
          YEARS: ${{ needs.years.outputs.years }}
        run: |
          set -euo pipefail
          previous=""
          for year in $YEARS; do
            npm run archive:download -- "$year"
            npm run kpi:year -- "$year"
            if [ -n "$previous" ]; then rm -rf "../breakups-archive/$previous"; fi
            previous="$year"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpi-years
          path: kpi/years/*.json.gz
          if-no-files-found: error
          retention-days: 14
      - run: npm run kpi -- --aggregate
      - name: Write the table to the summary and the diff to a file
        run: |
          set -euo pipefail
          cat kpi/latest.md >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat -- kpi/latest.json > "$RUNNER_TEMP/diff-stat.txt" || true
          git --no-pager diff -- kpi/latest.json > "$RUNNER_TEMP/diff.txt" || true
          if [ -s "$RUNNER_TEMP/diff.txt" ]; then
            echo "the fresh aggregate differs from the committed kpi/latest.json:"
            cat "$RUNNER_TEMP/diff-stat.txt"
          else
            echo "the fresh aggregate equals the committed kpi/latest.json"
          fi
      - name: Keep one comment on the pull request up to date
        if: github.event_name == 'pull_request'
        # A pull request from a fork has no leave to comment; the summary above still carries the table.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- kpi-scorecard -->";
            const diff = fs.readFileSync(`${process.env.RUNNER_TEMP}/diff.txt`, "utf8").trim();
            const table = fs.readFileSync("kpi/latest.md", "utf8").split("\n## ")[1] ?? "";
            const body = [
              marker,
              "## The scorecard on this pull request",
              "",
              diff === "" ? "The fresh aggregate equals the committed `kpi/latest.json`." : "The fresh aggregate differs from the committed `kpi/latest.json`; commit the regenerated file with the change.",
              "",
              diff === "" ? "" : "```diff\n" + diff.slice(0, 60_000) + "\n```",
              "",
              "## " + table,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((comment) => comment.body !== undefined && comment.body.startsWith(marker));
            if (mine === undefined) await github.rest.issues.createComment({ owner, repo, issue_number, body });
            else await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
      # The committed aggregate is the record: a fresh one that differs fails the run, on a pull request as on main, so the check and the comment agree.
      - name: The committed aggregate must be reproducible
        run: git diff --exit-code -- kpi/latest.json kpi/latest.md

  # GitHub disables a scheduled workflow after sixty days with no activity in the repository; the weekly run enables again
  # any it disabled so, never one a person disabled (scripts/maintenance/keep-alive.ts).
  keep-alive:
    name: keep the scheduled workflows enabled
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable the workflows GitHub disabled for inactivity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npm run -s maintenance:keep-alive
